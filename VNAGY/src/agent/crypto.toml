[package]
name = "crypto"
version = "0.1.0"
edition = "2021"

[dependencies]
chacha20poly1305 = "0.11.0"
zeroize = { version = "1.6", features = ["derive"] }
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
getrandom = { version = "0.2", features = ["std"] }
subtle = "2.5"      # Added for constant-time security comparisons
libc = "0.2"        # Added for mlock memory locking on Linux/Yocto edge nodes
